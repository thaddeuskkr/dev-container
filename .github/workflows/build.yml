name: VM images (multiarch)

on:
  push:
    paths:
      - Dockerfile
      - entrypoint.sh
      - sandbox-entrypoint.sh
      - docker-bake.hcl
      - compose*.yml
      - tests/**
      - .dockerignore
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

# Serialize releases so an older run cannot overwrite newer moving tags.
concurrency:
  group: vm-images-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: docker.io/thadkkr/vm
  GHCR_IMAGE: ghcr.io/thaddeuskkr/vm

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.build.outputs.date }}
      created: ${{ steps.build.outputs.created }}
      publish: ${{ steps.build.outputs.publish }}
      dockerhub: ${{ steps.build.outputs.dockerhub }}
      ghcr: ${{ steps.build.outputs.ghcr }}
      images: ${{ steps.build.outputs.images }}
    steps:
      - name: Choose build date and available publishing destinations
        id: build
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR }}
        run: |
          dockerhub=false
          ghcr=false
          images=()
          if [ "$PUBLISH" = true ]; then
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              dockerhub=true
              images+=("$DOCKERHUB_IMAGE")
            else
              echo "::notice::Skipping Docker Hub: DOCKERHUB_TOKEN is not configured."
            fi
            if [ "$PUBLISH_GHCR" = false ]; then
              echo "::notice::Skipping GHCR: PUBLISH_GHCR is false."
            elif [ -n "$GHCR_TOKEN" ]; then
              ghcr=true
              images+=("$GHCR_IMAGE")
            else
              echo "::notice::Skipping GHCR: GITHUB_TOKEN is not available."
            fi
          fi
          if [ "${#images[@]}" -eq 0 ]; then
            PUBLISH=false
          fi
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "publish=$PUBLISH"
            echo "dockerhub=$dockerhub"
            echo "ghcr=$ghcr"
            echo "images=$(IFS=,; echo "${images[*]}")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: [dev, sandbox]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose and Bake configuration
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.sandbox.yml config --quiet
          docker buildx bake --print

      - name: Build and load image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Refresh APT packages and upstream installers on daily builds.
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: local/vm:${{ matrix.variant }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.version=${{ matrix.variant }}-${{ needs.prepare.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Smoke-test image
        run: bash tests/smoke.sh '${{ matrix.variant }}' 'local/vm:${{ matrix.variant }}'

      - name: Login to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: thadkkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: needs.prepare.outputs.ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the tested build's local BuildKit cache; does not rerun installers.
      - name: Push tested image by digest to configured registries
        if: needs.prepare.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.prepare.outputs.images }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.version=${{ matrix.variant }}-${{ needs.prepare.outputs.date }}

      - name: Export digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [dev, sandbox]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this variant's digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Login to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: thadkkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: needs.prepare.outputs.ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish and verify multiarch tags in configured registries
        working-directory: ${{ runner.temp }}/digests
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_DATE: ${{ needs.prepare.outputs.date }}
          REVISION: ${{ github.sha }}
          PUBLISH_IMAGES: ${{ needs.prepare.outputs.images }}
        run: |
          IFS=, read -r -a images <<< "$PUBLISH_IMAGES"
          digests=(*)
          test "${#digests[@]}" -eq 2
          for image in "${images[@]}"; do
            sources=()
            for digest in "${digests[@]}"; do
              sources+=("$image@sha256:$digest")
            done
            docker buildx imagetools create \
              --tag "$image:$VARIANT" \
              --tag "$image:$VARIANT-$BUILD_DATE" \
              --tag "$image:$VARIANT-sha-$REVISION" \
              "${sources[@]}"
            docker buildx imagetools inspect "$image:$VARIANT-$BUILD_DATE" --raw > manifest.json
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          done
